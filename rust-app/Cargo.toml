[package]
name = "roi-ocr-helper"
version = "1.4.4"
edition = "2024"
description = "Native Windows camera and screen ROI OCR helper"
license = "MIT"

[dependencies]
arboard = "3.6.1"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["clock", "serde"] }
crossbeam-channel = "0.5.15"
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence"] }
global-hotkey = "0.8.0"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
nokhwa = { version = "0.10.11", default-features = false, features = ["decoding", "input-native"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "json", "multipart", "native-tls"] }
raw-window-handle = "0.6.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tray-icon = "0.25.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.34"

[package.metadata.winresource]
OriginalFilename = "ROI-OCR-Helper.exe"
ProductName = "แปลงภาพเป็นข้อความ"
FileDescription = "แปลงภาพเป็นข้อความ"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "abort"
